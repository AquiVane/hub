<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMART Marketing Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-name">COSMART</div>
      <div class="logo-tagline">Marketing Hub</div>
      <span id="sb-client-sub"></span>
    </div>
    <div class="sidebar-client">
      <strong id="sb-client-name">Cargando...</strong>
      <span id="sb-client-ig"></span>
    </div>
    <nav class="nav-section">
      <div class="nav-section-label">Panel</div>
      <button class="nav-item active" data-section="home">
        <span class="icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-item" data-section="contenidos">
        <span class="icon">📅</span><span>Contenidos</span>
      </button>
      <button class="nav-item" data-section="tareas">
        <span class="icon">✅</span><span>Tareas</span>
        <span class="badge" id="badge-tareas">0</span>
      </button>
      <button class="nav-item" data-section="pauta">
        <span class="icon">📊</span><span>Pauta Digital</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Home</div>
        <div class="topbar-sub" id="topbar-sub">Resumen del mes</div>
      </div>
      <div class="topbar-right" id="topbar-actions"></div>
    </div>
    <div class="content" id="main-content">
      <div class="empty-state"><div class="empty-state-icon">⏳</div><p>Cargando...</p></div>
    </div>
  </div>
</div>

<!-- Modal: Contenido (nuevo / editar) -->
<div id="contenidoModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-cont-title">Nuevo contenido</h3>
      <button class="modal-close" id="closeContenidoModal">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">

        <div class="form-group span-3" style="grid-column:span 3;">
          <label>Título del contenido *</label>
          <input type="text" id="cf-titulo" class="form-control" placeholder="Ej: Story 1 – Show La Rosalía">
        </div>

        <div class="form-group">
          <label>Fecha de publicación</label>
          <input type="date" id="cf-fecha" class="form-control">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="cf-estado" class="form-control">
            <option value="Idea">💡 Idea</option>
            <option value="En proceso">✏️ En proceso</option>
            <option value="En revisión">👁 En revisión</option>
            <option value="Aprobado">✅ Aprobado</option>
            <option value="Programado">📅 Programado</option>
            <option value="Publicado">🚀 Publicado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cuenta</label>
          <input type="text" id="cf-cuenta" class="form-control" placeholder="@cuenta">
        </div>

        <div class="form-group">
          <label>Plataformas</label>
          <div style="display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;">
            <label style="font-weight:400;font-size:13px;display:flex;gap:8px;align-items:center;"><input type="checkbox" value="Instagram" class="plat-check"> Instagram</label>
            <label style="font-weight:400;font-size:13px;display:flex;gap:8px;align-items:center;"><input type="checkbox" value="Facebook" class="plat-check"> Facebook</label>
            <label style="font-weight:400;font-size:13px;display:flex;gap:8px;align-items:center;"><input type="checkbox" value="LinkedIn" class="plat-check"> LinkedIn</label>
            <label style="font-weight:400;font-size:13px;display:flex;gap:8px;align-items:center;"><input type="checkbox" value="Twitter" class="plat-check"> Twitter / X</label>
          </div>
        </div>
        <div class="form-group">
          <label>Ubicación</label>
          <select id="cf-ubicacion" class="form-control">
            <option>Feed</option>
            <option>Story</option>
            <option>Reel</option>
            <option>Carrusel</option>
          </select>
        </div>
        <div class="form-group">
          <label>Formato</label>
          <select id="cf-formato" class="form-control">
            <option>Imagen</option>
            <option>Video</option>
            <option>Reel</option>
            <option>Carrusel</option>
            <option>Story</option>
            <option>GIF</option>
          </select>
        </div>

        <div class="form-group">
          <label>Eje de comunicación</label>
          <select id="cf-eje" class="form-control">
            <option>Institucional</option>
            <option>Entretenimiento</option>
            <option>Comercial</option>
            <option>Interacción</option>
            <option>Educativo</option>
            <option>Inspiracional</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de contenido</label>
          <select id="cf-tipo" class="form-control">
            <option>Informativo</option>
            <option>Promocional</option>
            <option>Sorteo</option>
            <option>Viral</option>
            <option>Evento</option>
            <option>Celebración</option>
            <option>Tutorial</option>
          </select>
        </div>
        <div class="form-group">
          <label>Objetivo</label>
          <select id="cf-objetivo" class="form-control">
            <option>Notoriedad</option>
            <option>Engagement</option>
            <option>Alcance</option>
            <option>Conversión</option>
            <option>Tráfico</option>
          </select>
        </div>

        <div class="form-group" style="grid-column:span 3;">
          <label>Copy / Texto del post</label>
          <textarea id="cf-copy" class="form-control" rows="3" placeholder="Escribí el texto que va a aparecer en el post..."></textarea>
        </div>

        <div class="form-group" style="grid-column:span 3;">
          <label>Link de imagen/video en Google Drive</label>
          <input type="url" id="cf-drive" class="form-control" placeholder="https://drive.google.com/file/d/...">
          <span style="font-size:11px;color:var(--text-muted);margin-top:3px;">Pegá el link de Drive del archivo (imagen, video, diseño)</span>
        </div>

        <div class="form-group" style="grid-column:span 3;">
          <label>Notas internas</label>
          <input type="text" id="cf-notas" class="form-control" placeholder="Ej: Subir en hora pico, esperar confirmación cliente...">
        </div>

      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="deleteContenidoBtn" style="margin-right:auto;">Eliminar</button>
      <button class="btn btn-secondary" id="closeContenidoModal2">Cancelar</button>
      <button class="btn btn-primary" id="saveContenidoBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Vista previa social -->
<div id="previewModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:960px;">
    <div class="modal-header">
      <h3 id="preview-modal-title">Vista previa</h3>
      <button class="modal-close" id="closePreviewModal">×</button>
    </div>
    <div class="modal-body" id="preview-modal-body"></div>
  </div>
</div>

<!-- Modal: Tarea -->
<div id="tareaModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3 id="tarea-modal-title">Nueva tarea</h3>
      <button class="modal-close" id="closeTareaModal">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group span-2">
          <label>Título *</label>
          <input type="text" id="tf-titulo" class="form-control" placeholder="¿Qué hay que hacer?">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="tf-estado" class="form-control">
            <option>Sin empezar</option>
            <option>En progreso</option>
            <option>Listo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <select id="tf-prioridad" class="form-control">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
          </select>
        </div>
        <div class="form-group span-2">
          <label>Notas</label>
          <textarea id="tf-notas" class="form-control" rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="deleteTareaBtn" style="margin-right:auto;">Eliminar</button>
      <button class="btn btn-secondary" id="closeTareaModal2">Cancelar</button>
      <button class="btn btn-primary" id="saveTareaBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Campaña -->
<div id="campanaModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3 id="campana-modal-title">Nueva campaña</h3>
      <button class="modal-close" id="closeCampanaModal">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group span-2">
          <label>Nombre *</label>
          <input type="text" id="pf-nombre" class="form-control" placeholder="Ej: Campaña Awareness Q3">
        </div>
        <div class="form-group">
          <label>Plataforma</label>
          <select id="pf-plataforma" class="form-control">
            <option>Meta Ads</option>
            <option>Google Ads</option>
            <option>TikTok Ads</option>
            <option>LinkedIn Ads</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="pf-estado" class="form-control">
            <option>Activa</option>
            <option>Pausada</option>
            <option>Finalizada</option>
            <option>Borrador</option>
          </select>
        </div>
        <div class="form-group">
          <label>Presupuesto total ($)</label>
          <input type="number" id="pf-presupuesto" class="form-control" placeholder="50000">
        </div>
        <div class="form-group">
          <label>Gastado hasta hoy ($)</label>
          <input type="number" id="pf-gastado" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>Fecha inicio</label>
          <input type="date" id="pf-inicio" class="form-control">
        </div>
        <div class="form-group">
          <label>Fecha fin</label>
          <input type="date" id="pf-fin" class="form-control">
        </div>
        <div class="form-group">
          <label>Impresiones</label>
          <input type="number" id="pf-impresiones" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>Alcance</label>
          <input type="number" id="pf-alcance" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>Clics</label>
          <input type="number" id="pf-clics" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>CPM ($)</label>
          <input type="number" id="pf-cpm" class="form-control" step="0.01" placeholder="0.00">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="deleteCampanaBtn" style="margin-right:auto;">Eliminar</button>
      <button class="btn btn-secondary" id="closeCampanaModal2">Cancelar</button>
      <button class="btn btn-primary" id="saveCampanaBtn">Guardar</button>
    </div>
  </div>
</div>

<script type="module" src="../js/app.js"></script>
</body>
</html>
