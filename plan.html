<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Plan de ejecución — COSMART</title>
<link rel="icon" type="image/png" href="app/favicon-cosmart.png?v=2">
<style>
  :root { --bg:#060F22; --bar:#091C47; --txt:#fff; --muted:#a8b6cc; --red:#E02020; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  body { display:flex; flex-direction:column; }
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--bar); border-bottom:1px solid rgba(255,255,255,.12); }
  .bar img { height:26px; }
  .bar .t { font-weight:700; font-size:14px; }
  .bar .m { margin-left:auto; font-size:12px; color:var(--muted); }
  iframe { flex:1 1 auto; width:100%; border:0; background:#fff; }
  .msg { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .msg div { max-width:420px; }
  .msg h1 { font-size:20px; margin:0 0 10px; }
  .msg p { color:var(--muted); font-size:14px; line-height:1.5; margin:0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none;">
  <img src="app/cosmart-logo.png" alt="COSMART">
  <span class="t" id="titulo">Plan de ejecución</span>
  <span class="m">Vista de solo lectura</span>
</div>
<div class="msg" id="cargando"><div><p>Cargando el plan…</p></div></div>
<div class="msg hidden" id="error"><div><h1>Este link no está disponible</h1><p id="errTxt">Venció o fue desactivado. Pedile a COSMART que te mande uno nuevo.</p></div></div>
<iframe id="frame" class="hidden" title="Plan de ejecución" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
<script type="module">
  import { WORKER_URL } from './js/firebase.js';
  const t = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);
  const fallo = txt => { $('cargando').classList.add('hidden'); if (txt) $('errTxt').textContent = txt; $('error').classList.remove('hidden'); };
  try {
    if (!/^[a-f0-9]{64}$/.test(t)) throw new Error();
    const r = await fetch(`${WORKER_URL}/publico/plan/${t}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.html) throw new Error();
    $('titulo').textContent = d.cliente ? `Plan de ejecución — ${d.cliente}` : 'Plan de ejecución';
    document.title = $('titulo').textContent;
    $('frame').srcdoc = d.html;           // aislado: sin acceso al Hub ni a ninguna sesión
    $('cargando').classList.add('hidden'); $('bar').style.display = 'flex'; $('frame').classList.remove('hidden');
  } catch (e) { fallo(); }
</script>
</body>
</html>
