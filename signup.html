<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Hub — Creá tu cuenta</title>
  <link rel="icon" type="image/png" href="app/favicon-cosmart.png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(150deg, #0D2B6B 0%, #1A4DAA 55%, #3A8FC7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .signup-box {
      background: #fff;
      border-radius: 20px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.28);
      color: #0D2B6B;
    }
    .signup-title { font-family:'Playfair Display',Georgia,serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .signup-subtitle { font-size: 13px; color: #64748b; margin-bottom: 22px; line-height: 1.5; }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #475569; }
    .form-control {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #0D2B6B;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
      width: 100%;
    }
    .form-control:focus { border-color: #3A8FC7; }
    .btn-signup {
      width: 100%;
      padding: 12px;
      background: #0D2B6B;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
      transition: background .2s;
      margin-top: 4px;
    }
    .btn-signup:hover { background: #1A4DAA; }
    .btn-signup:disabled { opacity: .6; cursor: not-allowed; }
    .signup-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
    .signup-success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; border-radius: 8px; padding: 14px; font-size: 13px; margin-bottom: 12px; display: none; line-height: 1.6; }
    .signup-footer { margin-top: 18px; text-align: center; font-size: 12px; color: #64748b; }
    .signup-footer a { color: #3A8FC7; text-decoration: none; font-weight: 600; }
    .signup-footer a:hover { text-decoration: underline; }
    .plan-note { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: #475569; line-height: 1.6; margin-bottom: 18px; }
  </style>
</head>
<body>

<div class="signup-box">
  <div class="signup-title">Creá tu Marketing Hub</div>
  <div class="signup-subtitle">Un panel propio para gestionar clientes, tareas, contenidos y campañas — con tu marca, aislado de cualquier otra cuenta.</div>

  <div class="plan-note">💳 USD 3/mes o USD 30/año. Tu cuenta arranca en modo prueba — te contactamos para activar el pago.</div>

  <div id="signup-error" class="signup-error"></div>
  <div id="signup-success" class="signup-success"></div>

  <form id="signupForm">
    <div class="form-group">
      <label for="agenciaNombre">Nombre de tu agencia/marca *</label>
      <input type="text" id="agenciaNombre" class="form-control" placeholder="Ej: Estudio Norte" required autofocus>
    </div>
    <div class="form-group">
      <label for="nombre">Tu nombre *</label>
      <input type="text" id="nombre" class="form-control" placeholder="Ej: Ana Pérez" required>
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
    </div>
    <button type="submit" class="btn-signup" id="signupBtn">Crear mi cuenta</button>
  </form>

  <div class="signup-footer">¿Ya tenés cuenta? <a href="/login.html">Iniciar sesión</a></div>
</div>

<script type="module">
  import { WORKER_URL } from './js/firebase.js';

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const agenciaNombre = document.getElementById('agenciaNombre').value.trim();
    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('signupBtn');
    const errEl = document.getElementById('signup-error');
    const sucEl = document.getElementById('signup-success');
    errEl.style.display = 'none';
    sucEl.style.display = 'none';
    if (password.length < 6) { errEl.textContent = 'La contraseña debe tener al menos 6 caracteres.'; errEl.style.display = 'block'; return; }
    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';
    try {
      const res = await fetch(WORKER_URL + '/agencia/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agenciaNombre, nombre, email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta.');
      document.getElementById('signupForm').style.display = 'none';
      sucEl.textContent = `¡Listo, ${nombre}! Tu Hub para ${agenciaNombre} ya está creado. Iniciá sesión con ${email} para empezar a cargar tus clientes.`;
      sucEl.style.display = 'block';
      setTimeout(() => { window.location.href = '/login.html'; }, 3500);
    } catch (err) {
      errEl.textContent = err.message || 'No se pudo crear la cuenta. Intentá de nuevo.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Crear mi cuenta';
    }
  });
</script>
</body>
</html>
